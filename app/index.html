<!doctype html>
<html class="light" lang="en" style="color-scheme: light; background: #fff8f5;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8f5" />
    <meta name="color-scheme" content="light only" />
    <meta name="description" content="Host events — invites, guests, Buzz, and day-of ops in one place." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BiyeFlow" />
    <title>BiyeFlow</title>
    <style>
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --vh: 1vh;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        min-height: calc(var(--vh, 1vh) * 100);
        min-height: -webkit-fill-available;
        background: #fff8f5;
        color: #1e1b18;
        color-scheme: light only;
        overflow: hidden;
      }
      #viewport-fill {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: #fff8f5;
        pointer-events: none;
      }
      #root {
        position: relative;
        z-index: 1;
        opacity: 0;
        width: 100%;
        min-height: 100dvh;
        min-height: calc(var(--vh, 1vh) * 100);
        min-height: -webkit-fill-available;
        background: transparent;
      }
      html.app-ready #root {
        opacity: 1;
        transition: opacity 160ms ease;
      }
      #boot-cover {
        position: fixed;
        inset: 0;
        z-index: 9998;
        background: #fff8f5;
        pointer-events: none;
      }
      html.app-ready #boot-cover {
        opacity: 0;
        transition: opacity 200ms ease;
      }
    </style>
    <script>
      (function () {
        // Nuclear cache clear: unregister all old SWs and purge caches once per build
        var SHELL_V = "v42";
        if (localStorage.getItem("bf.sv") !== SHELL_V) {
          localStorage.setItem("bf.sv", SHELL_V);
          var did = false;
          if ("caches" in window) {
            caches.keys().then(function (names) {
              names.forEach(function (n) { caches.delete(n); });
            });
            did = true;
          }
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { r.unregister(); });
              if (did || regs.length) {
                setTimeout(function () { location.reload(); }, 200);
              }
            });
          }
        } else if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) { reg.update(); });
          });
        }

        var standalone =
          window.matchMedia("(display-mode: standalone)").matches ||
          window.matchMedia("(display-mode: fullscreen)").matches ||
          window.navigator.standalone === true;

        var ua = navigator.userAgent || "";
        var ios = /iPhone|iPad|iPod/i.test(ua);

        // iOS (browser + PWA): use contain — Safari handles status bar.
        // On iOS 26.1 PWA, cover + env()=0 causes double inset / white gap (WebKit #301994).
        if (!standalone || ios) {
          var vp = document.querySelector('meta[name="viewport"]');
          if (vp) {
            var next = (vp.getAttribute("content") || "").replace(
              "viewport-fit=cover",
              "viewport-fit=contain"
            );
            if (next.indexOf("maximum-scale") === -1) {
              next =
                "width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=contain";
            }
            vp.setAttribute("content", next);
          }
        }

        var height = window.innerHeight;
        document.documentElement.style.setProperty("--vh", height * 0.01 + "px");
      })();
    </script>
  </head>
  <body>
    <div id="viewport-fill" aria-hidden="true"></div>
    <div id="boot-cover" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
